[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neomon"
version = "1.0.0"
description = "The ultimate terminal system monitor – modern TUI with braille graphs, multi-theme support, and interactive process management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["system-monitor", "tui", "terminal", "psutil", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
    "textual>=0.70",
]

[project.scripts]
neomon = "neomon.__main__:main"

[project.urls]
Homepage   = "https://github.com/despotak/neomon"
Repository = "https://github.com/despotak/neomon"
Issues     = "https://github.com/despotak/neomon/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["neomon*"]
